databases:
  # Database Service
  - name: smart-transport-db
    plan: free
    postgresMajorVersion: "15"

services:

  # Spring Boot Backend
  - type: web
    name: smart-transport-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: smart-transport-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-transport-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-transport-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: smart-transport-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: smart-transport-db
          property: password

  # React Frontend
  - type: web
    name: smart-transport-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-transport-backend
          property: host
